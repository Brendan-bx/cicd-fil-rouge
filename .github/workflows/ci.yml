on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  define-matrix:
    name: Define matrix
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.define-matrix.outputs.python-version }}
    steps:
      - name: Define matrix
        id: define-matrix
        run: echo 'python-version=["3.11", "3.12", "3.13"]' >> "$GITHUB_OUTPUT"
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.define-matrix.outputs.python-version) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check --output-format=github --target-version=py310 .

  test:
    name: Test with pytest
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.define-matrix.outputs.python-version) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt coverage[xml]
      - name: Test with pytest
        run: coverage run -m pytest -v -s
      - name: Generate Coverage Artifacts
        run: coverage xml -o coverage.xml
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [define-matrix, lint, test]
    if: always()
    steps:
      - name: Require every job to succeed
        run: |
          echo "define-matrix=${{ needs.define-matrix.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          test "${{ needs.define-matrix.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"